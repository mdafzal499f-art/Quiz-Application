<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Quiz Application</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body class="login-body">

<div class="login-container">
    <a href="index.html" class="logo">
        Quiz<span>Application</span>
    </a>

    <div class="login-card">
        <div class="login-icon">🧠</div>

        <h1>Create Account</h1>
        <p class="login-subtitle">Join Quiz Application and start learning.</p>

        <form id="signupForm">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Create password" minlength="6" required>

            <p id="authMessage"></p>

            <button type="submit" class="login-submit">
                Create Account →
            </button>
        </form>

        <div class="login-divider"><span>OR</span></div>

        <p class="signup-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

    <p class="login-footer">
        © 2026 QuizApplication. All Rights Reserved.
    </p>
</div>

<script src="auth.js"></script>
</body>
</html>
